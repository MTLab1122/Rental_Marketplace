# =============================================================================
# Rental Peshawar - Hardened Production Docker Compose Orchestration
# Zero-Trust Network Isolation, Non-Root Runtime, Resource Limits & CIS Hardened
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. Edge Reverse Proxy / Ingress WAF (The ONLY Public Entry Point)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: rental_peshawar_prod_nginx
    restart: always
    security_opt:
      - no-new-privileges:true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
    depends_on:
      - api
      - web
      - admin
    networks:
      - rental_prod_net

  # ---------------------------------------------------------------------------
  # 2. Primary Relational & Spatial Database (PostGIS) - NO PUBLIC PORT EXPOSURE
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rental_peshawar_prod_postgres
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-rental_peshawar_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c maintenance_work_mem=128MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c work_mem=2621kB
               -c min_wal_size=1GB
               -c max_wal_size=4GB
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/init-roles.sql:ro
    expose:
      - '5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rental_peshawar_prod}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - rental_prod_net

  # ---------------------------------------------------------------------------
  # 3. Redis Cache & Queue Broker - NO PUBLIC PORT EXPOSURE
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rental_peshawar_prod_redis
    restart: always
    security_opt:
      - no-new-privileges:true
    command: >
      redis-server --appendonly yes
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
                   --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be provided}
    volumes:
      - prod_redis_data:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - rental_prod_net

  # ---------------------------------------------------------------------------
  # 4. Object Storage (S3 / MinIO) - NO PUBLIC DIRECT ACCESS
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: rental_peshawar_prod_minio
    restart: always
    security_opt:
      - no-new-privileges:true
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rentalminioprod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be provided}
    volumes:
      - prod_minio_data:/data
    expose:
      - '9000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - rental_prod_net

  # ---------------------------------------------------------------------------
  # 5. Core Backend API (NestJS + Prisma) - Isolated on Internal Network
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rental_peshawar_prod_api
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-app_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rental_peshawar_prod}?schema=public&sslmode=prefer
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be provided}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be provided}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rentalpeshawar.pk,https://admin.rentalpeshawar.pk}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-rentalminioprod}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-rental-peshawar-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      WEB_URL: https://rentalpeshawar.pk
      ADMIN_URL: https://admin.rentalpeshawar.pk
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    networks:
      - rental_prod_net

  # ---------------------------------------------------------------------------
  # 6. Public Web Application (Next.js) - Internal Port Exposed to Nginx Only
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rental_peshawar_prod_web
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: https://api.rentalpeshawar.pk/api/v1
    depends_on:
      - api
    expose:
      - '3001'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - rental_prod_net

  # ---------------------------------------------------------------------------
  # 7. Admin Operations Console (Next.js) - Internal Port Exposed to Nginx Only
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: rental_peshawar_prod_admin
    restart: always
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: https://api.rentalpeshawar.pk/api/v1
    depends_on:
      - api
    expose:
      - '3002'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    networks:
      - rental_prod_net

volumes:
  prod_postgres_data:
    driver: local
  prod_redis_data:
    driver: local
  prod_minio_data:
    driver: local

networks:
  rental_prod_net:
    driver: bridge
