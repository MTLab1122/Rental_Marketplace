# ==========================================
# Rental Peshawar - Production Docker Compose Orchestration
# ==========================================

services:
  # 1. Primary Relational & Spatial Database (PostGIS)
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rental_peshawar_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-PeshawarSecureProd2026!}
      POSTGRES_DB: ${POSTGRES_DB:-rental_peshawar_prod}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: >
      postgres -c max_connections=200
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c maintenance_work_mem=128MB
               -c checkpoint_completion_target=0.9
               -c wal_buffers=16MB
               -c default_statistics_target=100
               -c random_page_cost=1.1
               -c effective_io_concurrency=200
               -c work_mem=2621kB
               -c min_wal_size=1GB
               -c max_wal_size=4GB
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql:ro
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rental_peshawar_prod}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - rental_prod_net

  # 2. Redis Cache & WebSocket Pub/Sub Broker
  redis:
    image: redis:7-alpine
    container_name: rental_peshawar_prod_redis
    restart: always
    command: >
      redis-server --appendonly yes
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
                   --requirepass ${REDIS_PASSWORD:-RedisSecureProd2026!}
    volumes:
      - prod_redis_data:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-RedisSecureProd2026!}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rental_prod_net

  # 3. Object Storage (S3 / MinIO) for Media & CNIC Documents
  minio:
    image: minio/minio:latest
    container_name: rental_peshawar_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rentalminioprod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-MinioSecureProdPass2026!}
    volumes:
      - prod_minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - rental_prod_net

  # 4. Core Backend API (NestJS + Prisma)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rental_peshawar_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-PeshawarSecureProd2026!}@postgres:5432/${POSTGRES_DB:-rental_peshawar_prod}?schema=public&connection_limit=50
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-RedisSecureProd2026!}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-ProdJwtAccessSecretPeshawar2026!32CharsMin}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-ProdJwtRefreshSecretPeshawar2026!32CharsMin}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rentalpeshawar.pk,https://admin.rentalpeshawar.pk}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-rentalminioprod}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-MinioSecureProdPass2026!}
      S3_BUCKET: ${S3_BUCKET:-rental-peshawar-media}
      S3_REGION: ${S3_REGION:-us-east-1}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rentalpeshawar.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-PeshawarAdmin2026!#}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rental_prod_net

  # 5. Public Web Application (Next.js)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: rental_peshawar_prod_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.rentalpeshawar.pk/api/v1}
    depends_on:
      - api
    ports:
      - '3001:3001'
    networks:
      - rental_prod_net

  # 6. Admin Operations Console (Next.js)
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: rental_peshawar_prod_admin
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.rentalpeshawar.pk/api/v1}
    depends_on:
      - api
    ports:
      - '3002:3002'
    networks:
      - rental_prod_net

volumes:
  prod_postgres_data:
    driver: local
  prod_redis_data:
    driver: local
  prod_minio_data:
    driver: local

networks:
  rental_prod_net:
    driver: bridge
