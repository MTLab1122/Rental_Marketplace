name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-workspace:
    name: Lint, Typecheck, Test & Build (Full Monorepo)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rental_peshawar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install

      - name: Validate Prisma Schema
        run: |
          cd apps/api
          npx prisma validate

      - name: Generate Prisma Client
        run: |
          cd apps/api
          npx prisma generate

      - name: Lint Monorepo
        run: pnpm lint

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build Backend (NestJS API)
        run: pnpm --filter @rental-peshawar/api build

      - name: Build Tenant Web Portal (Next.js)
        run: pnpm --filter @rental-peshawar/web build

      - name: Build Admin Console (Next.js)
        run: pnpm --filter @rental-peshawar/admin build

  mobile-ci:
    name: Flutter Mobile CI & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter & Dart
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd apps/mobile
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd apps/mobile
          flutter analyze

      - name: Run Flutter Widget Tests
        run: |
          cd apps/mobile
          flutter test
